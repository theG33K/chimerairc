[package]
name = "chimerairc"
description = "ChimeraIRC - a Windows IRC client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
chimerairc-proto = { path = "../chimerairc-proto" }
chimerairc-core = { path = "../chimerairc-core" }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
windows.workspace = true
regex = "1.13.2"
mlua = { version = "0.11.5", features = ["lua54", "vendored"] }

[build-dependencies]
embed-resource = "3"
