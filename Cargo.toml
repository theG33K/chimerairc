[workspace]
resolver = "2"
members = ["crates/chimerairc-proto", "crates/chimerairc-core", "crates/chimerairc-gui"]
exclude = ["hydrairc"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"

[workspace.dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls",
  "Win32_UI_Controls_RichEdit",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Com",
  "Win32_UI_Shell_Common",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_SystemInformation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_System_Time",
  "Win32_Graphics_Dwm",
  "Win32_UI_Controls_Dialogs",
  "Win32_System_Registry",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
